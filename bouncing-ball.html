<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing ball — every bounce it gets bigger and faster</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #fff;
    font: 500 14px/1.4 "Segoe UI", Inter, system-ui, sans-serif;
  }

  /* Le format est verrouillé en 9:16 : on tient dans la fenêtre sans jamais
     déformer le canvas, quelle que soit sa forme. */
  #stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 1080 / 1920));
    height: min(100vh, calc(100vw * 1920 / 1080));
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* #trail n'est jamais effacé : il porte toute la peinture accumulée.
     #main est effacé chaque frame et se superpose, donc l'anneau rouge et
     l'UI restent toujours nets au-dessus des traînées. */
  #trail { z-index: 0; }
  #main  { z-index: 1; }

  /* WebAudio exige un geste utilisateur : l'écran de lancement est le seul
     élément d'interface en dehors du compteur, et il disparaît au clic. */
  #gate {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: grid;
    place-items: center;
    background: #000;
    cursor: pointer;
    text-align: center;
    transition: opacity .25s linear;
  }
  #gate.off { opacity: 0; pointer-events: none; }
  #gate b {
    display: block;
    font-weight: 900;
    font-size: clamp(18px, 3.4vh, 34px);
    letter-spacing: .22em;
  }
  #gate span {
    display: block;
    margin-top: 1.1em;
    color: #666;
    font-size: clamp(11px, 1.5vh, 15px);
    letter-spacing: .16em;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="wrap">
    <canvas id="trail" width="1080" height="1920"></canvas>
    <canvas id="main"  width="1080" height="1920"></canvas>
    <div id="gate"><b>CLIQUER POUR LANCER</b><span>R — RELANCER</span></div>
  </div>
</div>

<script>
'use strict';

/* ------------------------------------------------------------------ format */

const W = 1080, H = 1920;
const CX = W / 2, CY = H / 2;

const ARENA_R = 420;   // rayon de collision : la surface de la balle le touche
const RING_W  = 14;    // épaisseur du contour rouge

/* ------------------------------------------------------------------ règles */

const R0        = 14;    // rayon de départ
const V0        = 6;     // vitesse initiale, en px/frame
const GRAVITY   = 0.35;  // px/frame², constante, vers le bas
const GROW      = 1.035; // rayon × à chaque rebond
const SPEEDUP   = 1.02;  // norme de la vitesse × à chaque rebond
const HUE_STEP  = 7;     // degrés de teinte gagnés à chaque rebond
const END_RATIO = 0.92;  // fin quand rayon_balle >= ARENA_R × ce ratio
const SUBSTEPS  = 4;     // sous-pas d'intégration par frame (plancher)
const SUB_MAX_PX = 3;    // déplacement max d'un sous-pas : borne la pénétration
const FIXED     = 1 / 60;
const TAU       = Math.PI * 2;

const START_OFFSET = 60; // décalage du point de départ par rapport au centre
const FADE         = 1;  // durée du fondu final, en secondes
const POP_LIFE     = 0.6;
const POP_Y        = 486; // sous le label, au-dessus de l'arène (bord à 526)
const POP_RISE     = 76;
const MAX_POPS     = 5;

/* -------------------------------------------------------- graine / hasard */

// Une graine = une vidéo identique. `?seed=xxx` rejoue exactement la même run.
function rngFrom(seed) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return function next() {
    h = (h + 0x6d2b79f5) >>> 0;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Graine par defaut choisie pour tomber a ~30 s : 'jacks' donne la meme run
// en 45 s, ce qui est long pour un Reel.
const SEED = new URL(location.href).searchParams.get('seed') ?? 'ball';

/* ---------------------------------------------------------------- surfaces */

const trail = document.getElementById('trail');
const main  = document.getElementById('main');
const tctx  = trail.getContext('2d');
const mctx  = main.getContext('2d');
const gate  = document.getElementById('gate');

const FONT_STACK = '"Segoe UI", Inter, Helvetica, Arial, sans-serif';

/* ------------------------------------------------------------------- audio */

// Gamme pentatonique majeure bouclée sur l'octave : la note monte d'un cran
// par rebond, puis repart du bas une fois l'octave atteinte.
const SCALE = [0, 2, 4, 7, 9, 12];
const BASE_HZ = 220;

let ac = null, masterGain = null, lastNoteAt = -1;

function audioStart() {
  if (ac) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  ac = new Ctx();
  masterGain = ac.createGain();
  masterGain.gain.value = 0.22;
  masterGain.connect(ac.destination);
}

function note(index) {
  if (!ac) return;
  const t = ac.currentTime;
  // Sur la fin les rebonds s'enchaînent à quelques frames d'écart : on évite
  // d'empiler des dizaines d'oscillateurs par seconde.
  if (t - lastNoteAt < 0.03) return;
  lastNoteAt = t;

  const semis = SCALE[(index - 1) % SCALE.length];
  const osc = ac.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = BASE_HZ * Math.pow(2, semis / 12);

  const env = ac.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(1, t + 0.01);           // attack 0.01 s
  env.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); // release 0.15 s

  osc.connect(env).connect(masterGain);
  osc.start(t);
  osc.stop(t + 0.2);
}

/* -------------------------------------------------------------------- état */

let ball, bounces, cooldown, phase, endT, pops, rnd;

function reset() {
  rnd = rngFrom(SEED);

  const a0 = rnd() * TAU;
  const a1 = rnd() * TAU;
  ball = {
    x: CX + Math.cos(a0) * START_OFFSET,
    y: CY + Math.sin(a0) * START_OFFSET,
    vx: Math.cos(a1) * V0,
    vy: Math.sin(a1) * V0,
    r: R0,
    hue: rnd() * 360,
  };

  bounces = 0;
  cooldown = 0;
  phase = 'run';
  endT = 0;
  pops = [];
  lastNoteAt = -1;

  tctx.clearRect(0, 0, W, H);
  trail.style.opacity = '1';
}

function ballColor(hue) {
  return 'hsl(' + (hue % 360).toFixed(1) + ', 100%, 55%)';
}

/* --------------------------------------------------------------- collision */

function onBounce(nx, ny) {
  bounces++;

  ball.r *= GROW;
  ball.vx *= SPEEDUP;             // multiplier les deux composantes revient
  ball.vy *= SPEEDUP;             // à multiplier la norme

  ball.hue = (ball.hue + HUE_STEP) % 360;

  // Le rayon vient d'augmenter alors que la balle était pile au contact :
  // sans ce recollage elle s'enfonce de 3,5 % dans le mur à chaque rebond.
  ball.x = CX + nx * (ARENA_R - ball.r);
  ball.y = CY + ny * (ARENA_R - ball.r);

  cooldown = 1;
  // En fin de course il tombe jusqu'à 3 rebonds dans la même frame : sans
  // décalage ni plafond, les « +1 » s'empilent au même pixel et forment une
  // bouillie illisible.
  pops.push({ t: 0, dx: (rnd() - 0.5) * 90 });
  if (pops.length > MAX_POPS) pops.shift();
  note(bounces);

  if (ball.r >= ARENA_R * END_RATIO) {
    phase = 'end';
    endT = 0;
  }
}

function collide() {
  const dx = ball.x - CX, dy = ball.y - CY;
  const d = Math.hypot(dx, dy) || 1e-9;
  if (d + ball.r < ARENA_R) return;

  const nx = dx / d, ny = dy / d;

  // Repositionnement exact sur le point de contact, AVANT toute décision :
  // la balle ne peut donc jamais rester collée au bord ni sortir de l'arène.
  ball.x = CX + nx * (ARENA_R - ball.r);
  ball.y = CY + ny * (ARENA_R - ball.r);

  const vn = ball.vx * nx + ball.vy * ny;
  if (vn <= 0) return;      // elle repart déjà vers l'intérieur : pas un rebond
  if (cooldown > 0) return; // garde-fou contre une double détection

  ball.vx -= 2 * vn * nx;   // v' = v - 2(v·n)n
  ball.vy -= 2 * vn * ny;

  onBounce(nx, ny);
}

/* ---------------------------------------------------------------- physique */

function stepFrame() {
  const speed = Math.hypot(ball.vx, ball.vy);

  // 4 sous-pas suffisent au début, mais en fin de course la balle fait ~75
  // px/frame dans un espace libre d'une quinzaine de pixels : à 4 sous-pas
  // elle franchit le mur de 15 px avant qu'on la détecte. On raffine donc
  // pour qu'un sous-pas n'avance jamais de plus de SUB_MAX_PX.
  const n = Math.max(SUBSTEPS, Math.ceil(speed / SUB_MAX_PX));
  const h = 1 / n;

  for (let i = 0; i < n; i++) {
    ball.vy += GRAVITY * h;
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;
    if (cooldown > 0) cooldown--;
    collide();
  }
}

/* ----------------------------------------------------------------- traînée */

// Un disque plein estampé une fois par frame, cerné de noir : c'est le
// chevauchement de ces stamps qui donne la « chenille » de disques.
function stamp() {
  tctx.beginPath();
  tctx.arc(ball.x, ball.y, ball.r, 0, TAU);
  tctx.fillStyle = ballColor(ball.hue);
  tctx.fill();
  tctx.lineWidth = 3;
  tctx.strokeStyle = '#000';
  tctx.stroke();
}

/* -------------------------------------------------------------------- tick */

function tick() {
  if (phase === 'run') {
    stepFrame();
    stamp();
  } else {
    endT += FIXED;
  }

  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].t += FIXED;
    if (pops[i].t >= POP_LIFE) pops.splice(i, 1);
  }
}

/* ------------------------------------------------------------------- rendu */

function ring() {
  mctx.beginPath();
  // Tracé centré à ARENA_R + RING_W/2 : le bord *intérieur* de l'anneau tombe
  // pile sur le rayon de collision, la balle le touche donc visuellement.
  mctx.arc(CX, CY, ARENA_R + RING_W / 2, 0, TAU);
  mctx.lineWidth = RING_W;
  mctx.strokeStyle = '#FF0000';
  mctx.stroke();
}

function ui() {
  mctx.textAlign = 'center';
  mctx.textBaseline = 'alphabetic';

  mctx.fillStyle = '#FFFFFF';
  mctx.font = '900 120px ' + FONT_STACK;
  if ('letterSpacing' in mctx) mctx.letterSpacing = '0px';
  mctx.fillText(String(bounces), CX, 300);

  mctx.fillStyle = '#8A8A8A';
  mctx.font = '700 30px ' + FONT_STACK;
  if ('letterSpacing' in mctx) mctx.letterSpacing = '10px';
  mctx.fillText('BOUNCES', CX, 356);
  if ('letterSpacing' in mctx) mctx.letterSpacing = '0px';

  mctx.font = '900 40px ' + FONT_STACK;
  mctx.fillStyle = '#FFFFFF';
  for (const p of pops) {
    const k = p.t / POP_LIFE;
    mctx.globalAlpha = 1 - k;
    mctx.fillText('+1', CX + p.dx, POP_Y - k * POP_RISE);
  }
  mctx.globalAlpha = 1;
}

function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function draw() {
  mctx.clearRect(0, 0, W, H);

  // 1) le canvas trail est déjà sous nous ; 2) l'anneau rouge par-dessus.
  ring();

  if (phase === 'run') {
    // 3) la balle courante.
    mctx.beginPath();
    mctx.arc(ball.x, ball.y, ball.r, 0, TAU);
    mctx.fillStyle = ballColor(ball.hue);
    mctx.fill();
    mctx.lineWidth = 3;
    mctx.strokeStyle = '#000';
    mctx.stroke();
  } else {
    // Fondu de 1 s : la traînée s'efface pendant que la balle grossit
    // jusqu'à remplir tout le cercle.
    const k = Math.min(1, endT / FADE);
    const e = easeOut(k);
    const inner = ARENA_R - RING_W / 2;
    trail.style.opacity = String(1 - e);

    mctx.beginPath();
    mctx.arc(CX, CY, ball.r + (inner - ball.r) * e, 0, TAU);
    mctx.fillStyle = ballColor(ball.hue);
    mctx.fill();

    ring(); // l'anneau reste net au-dessus du disque final
  }

  // 4) UI.
  ui();
}

/* ------------------------------------------------------------------ boucle */

let acc = 0, last = 0, running = false;

function loop(ts) {
  if (!running) return;
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.25) dt = 0.25;     // onglet en arrière-plan : on ne rattrape pas

  acc += dt;
  let guard = 0;
  while (acc >= FIXED && guard++ < 240) {
    acc -= FIXED;
    tick();
  }

  draw();
  requestAnimationFrame(loop);
}

function start() {
  audioStart();
  if (ac && ac.state === 'suspended') ac.resume();
  reset();
  acc = 0;
  last = 0;
  running = true;
  gate.classList.add('off');
  requestAnimationFrame(loop);
}

gate.addEventListener('click', start);
addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') start();
});

// Première image visible derrière l'écran de lancement.
reset();
draw();
</script>
</body>
</html>
